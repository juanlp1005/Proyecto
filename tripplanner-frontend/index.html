<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TripPlanner AI</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mut:#6b7280;--acc:#1d4ed8;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center}
nav{display:flex;gap:6px;flex:1}nav button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:transparent;color:#cbd5e1;font:inherit}
nav button.on{background:#1e3a8a;color:#fff}
.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff;font:inherit}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.grid .card{margin:0}
.mut{color:var(--mut)}.err{color:#b91c1c}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{font-size:12px;border-radius:99px;padding:3px 10px;background:#e5e7eb}
.badge.SIMULADA{background:#dbeafe;color:#1e40af}.badge.PENDIENTE{background:#fef3c7;color:#92400e}.badge.CONFIRMADA{background:#dcfce7;color:#166534}
.login{max-width:340px;margin:12vh auto}.login input,.send input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;font:inherit}
.send{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0}.send input{margin:0}
.u{background:#dbeafe;margin-left:15%}.b{margin-right:5%}code{background:#eef2ff;padding:1px 5px;border-radius:4px}
</style></head><body>
<div id="login" class="card login"><h2>TripPlanner AI</h2><form onsubmit="login(event)">
<input id="em" type="email" placeholder="Correo" required><input id="pw" type="password" placeholder="Contraseña" required>
<button class="btn">Entrar</button></form><p id="err" class="err"></p></div>
<div id="app" hidden>
<header><b>TripPlanner AI</b><nav>
<button data-t="chat" class="on">Asistente</button><button data-t="trips">Mis viajes</button><button data-t="res">Reservas</button></nav>
<button class="btn" onclick="logout()">Salir</button></header>
<main><section id="chat"><div id="log"></div>
<div class="send"><input id="msg" placeholder="Cuéntame tu viaje…" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Enviar</button></div></section>
<section id="trips" hidden></section><section id="res" hidden></section></main></div>
<script>
const CFG={region:"us-east-2",clientId:"30u7ace2fjpki3ka7le8eq4b4",api:"https://96wcseoxcj.execute-api.us-east-2.amazonaws.com",
agentArn:"arn:aws:bedrock-agentcore:us-east-2:293694139479:runtime/TripPlannerA2A_OrchestratorAgent-VLmhKbA6V9"};
const AGENT_URL=`https://bedrock-agentcore.${CFG.region}.amazonaws.com/runtimes/${encodeURIComponent(CFG.agentArn)}/invocations?qualifier=DEFAULT`;
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*(.*)$/gm,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
const money=(n,c="COP")=>{if(n==null)return "-";try{return new Intl.NumberFormat("es-CO",{style:"currency",currency:c,maximumFractionDigits:0}).format(n)}catch{return n+" "+c}};
const ST={SIMULADA:"Simulada",PENDIENTE:"Pendiente",CONFIRMADA:"Confirmada"};
const L=d=>[].concat(d||[]);
const R={
trips:d=>L(d).map(t=>`<div class="card"><b>${esc(t.destination)}</b> <span class="mut">desde ${esc(t.origin)}</span><br>${esc(t.start_date)} → ${esc(t.end_date)} · ${esc(t.travelers)} viajeros<br>Presupuesto: ${money(t.budget)}<br>${(t.tripId||t.id||t.trip_id)?`<small class="mut">ID ${esc(t.tripId||t.id||t.trip_id)}</small>`:""}</div>`).join(""),
flights:d=>`<div class="grid">${L(d).map(f=>`<div class="card"><b>${esc(f.airline)}</b><br>Ida: ${esc(f.departure)} → ${esc(f.arrival)}<br>${f.return_departure?`Vuelta: ${esc(f.return_departure)} → ${esc(f.return_arrival)}<br>`:""}<b>${money(f.price_total??f.price,f.currency||"COP")}</b>${f.travelers?` <small class="mut">total ${esc(f.travelers)} pers.</small>`:""}</div>`).join("")}</div>`,
weather:d=>`<div class="grid">${L(d).map(w=>`<div class="card"><b>${esc(w.date)}</b><br>${esc(w.condition??"-")}<br>${w.temp_min==null?"":esc(w.temp_min)+"° / "}${esc(w.temp_max??"?")}°<br>Lluvia: ${w.rain_probability==null?"s/d":esc(w.rain_probability)+"%"}</div>`).join("")}</div>`,
itinerary:d=>L(d.days||d).map(x=>`<div class="card"><b>${esc(x.date)}</b>${L(x.activities).map(a=>`<div>${esc(a.time)} · <b>${esc(a.title)}</b> <small class="mut">${esc(a.description)}</small></div>`).join("")}</div>`).join(""),
reservations:d=>L(d).map(r=>`<div class="card row"><div><b>${esc(r.title)}</b> <small class="mut">${esc(r.type)}</small><br><small>${esc(r.provider||"")} ${esc(r.date||"")} ${r.price!=null?money(r.price):""} · viaje ${esc(r.tripId)}</small></div><span class="badge ${esc(r.status)}">${ST[r.status]||esc(r.status)}</span></div>`).join("")};
const HIST=[];
let token=sessionStorage.getItem("tp_token")||"";
const sid=()=>{let s=sessionStorage.getItem("tp_sid");if(!s){s="sesion-"+[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("")+"-web";sessionStorage.setItem("tp_sid",s)}return s};
async function login(e){e.preventDefault();$("#err").textContent="";
try{const r=await fetch(`https://cognito-idp.${CFG.region}.amazonaws.com/`,{method:"POST",headers:{"Content-Type":"application/x-amz-json-1.1","X-Amz-Target":"AWSCognitoIdentityProviderService.InitiateAuth"},body:JSON.stringify({AuthFlow:"USER_PASSWORD_AUTH",ClientId:CFG.clientId,AuthParameters:{USERNAME:$("#em").value,PASSWORD:$("#pw").value}})});
const d=await r.json();if(!r.ok)throw new Error(d.message||"Credenciales inválidas");
token=d.AuthenticationResult.IdToken;sessionStorage.setItem("tp_token",token);start()}catch(x){$("#err").textContent=x.message}}
function logout(){HIST.length=0;token="";sessionStorage.clear();$("#app").hidden=true;$("#login").hidden=false}
function start(){$("#login").hidden=true;$("#app").hidden=false;loadTrips();loadRes()}
async function api(p){const r=await fetch(CFG.api+p,{headers:{Authorization:"Bearer "+token}});
if(r.status==401){logout();throw new Error("Sesión vencida")}
if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));
["chat","trips","res"].forEach(t=>$("#"+t).hidden=t!=b.dataset.t);if(b.dataset.t=="trips")loadTrips();if(b.dataset.t=="res")loadRes()});
async function loadTrips(){const el=$("#trips");try{const d=(await api("/trips")).trips||[];
el.innerHTML=d.length?d.map(t=>R.trips(t)+`<button class="btn" onclick="showIt('${esc(t.tripId)}',this)">Ver itinerario</button><div></div>`).join(""):"<p class='mut'>Aún no tienes viajes. Pídele al asistente que cree uno.</p>"}catch(x){el.innerHTML=`<p class="err">${esc(x.message)}</p>`}}
async function showIt(id,btn){const box=btn.nextElementSibling;if(box.innerHTML){box.innerHTML="";btn.textContent="Ver itinerario";return}try{box.innerHTML=R.itinerary(await api(`/trips/${id}/itinerary`));btn.textContent="Ocultar itinerario"}catch(x){box.innerHTML=`<p class="mut">${esc(x.message)}</p>`;btn.textContent="Ocultar"}}
async function loadRes(){const el=$("#res");try{const d=(await api("/reservations")).reservations||[];el.innerHTML=d.length?R.reservations(d):"<p class='mut'>Sin reservas todavía.</p>"}catch(x){el.innerHTML=`<p class="err">${esc(x.message)}</p>`}}
function add(cls,html){const d=document.createElement("div");d.className="card "+cls;d.innerHTML=html;$("#log").appendChild(d);d.scrollIntoView({block:"end"});return d}
const piece=ev=>ev.split("\n").filter(l=>l.startsWith("data:")).map(l=>{const v=l.slice(5).trim();try{return String(JSON.parse(v))}catch{return v}}).join("");
const cards=t=>[...t.matchAll(/```json\s*([\s\S]*?)```/g)].map(m=>{try{const j=JSON.parse(m[1]);return R[j.type]?R[j.type](j.data):""}catch(e){console.warn("JSON de tarjeta invalido",m[1],e);return ""}}).join("");
async function send(){const inp=$("#msg"),q=inp.value.trim();if(!q)return;inp.value="";
add("u",esc(q));const out=add("b","<i class='mut'>Pensando…</i>");let txt="";
try{const r=await fetch(AGENT_URL,{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json","X-Amzn-Bedrock-AgentCore-Runtime-Session-Id":sid()},body:JSON.stringify({prompt:q,history:HIST.slice(-6)})});
if(r.status==401||r.status==403){logout();return}
if(!r.ok)throw new Error("Error "+r.status);
const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
let i;while((i=buf.indexOf("\n\n"))>=0){txt+=piece(buf.slice(0,i));buf=buf.slice(i+2)}
out.innerHTML=fmt(txt.split("```json")[0])||"<i class='mut'>Pensando…</i>";out.scrollIntoView({block:"end"})}
if(buf.trim())txt+=piece(buf);HIST.push({role:"user",text:q},{role:"assistant",text:txt});
out.innerHTML=fmt(txt.replace(/```json[\s\S]*?```/g,"").trim())+cards(txt);loadTrips();loadRes()}
catch(x){out.innerHTML=`<span class="err">${esc(x.message)}</span>`}}
if(token)start();
</script><script src="extras.js"></script></body></html>
